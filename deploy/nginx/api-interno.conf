# BEGIN TELUN API-INTERNAL MANAGED
# Origem oficial do monólito Telun. O navegador usa chronoshub na Vercel; este
# vhost recebe o rewrite externo e encaminha tudo ao container privado.

map $http_origin $telun_cors_origin {
    default "";
    "https://chronoshub.chronostek.com.br" "https://chronoshub.chronostek.com.br";
}

map $http_origin $telun_origin_forbidden {
    default 1;
    "" 0;
    "https://chronoshub.chronostek.com.br" 0;
}

map $http_upgrade $telun_connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 80;
    server_name api-interno.chronostek.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api-interno.chronostek.com.br;

    ssl_certificate     /etc/letsencrypt/live/api-interno.chronostek.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-interno.chronostek.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TELUN_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 5m;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Access-Control-Allow-Origin $telun_cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Next-Action, Next-Router-Prefetch, Next-Router-State-Tree, RSC, X-CSRF-Token, X-Requested-With" always;
    add_header Vary "Origin" always;

    location / {
        if ($telun_origin_forbidden) {
            return 403;
        }

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://telun-web:3000;
        proxy_http_version 1.1;
        proxy_buffering off;

        # O processo Next.js deve enxergar a origem pública usada pelo
        # navegador, não o hostname técnico do backend.
        proxy_set_header Host chronoshub.chronostek.com.br;
        proxy_set_header X-Forwarded-Host chronoshub.chronostek.com.br;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $telun_connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
# END TELUN API-INTERNAL MANAGED
